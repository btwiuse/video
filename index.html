<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='none'/></svg>">
  <title>Film Pipeline Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        colors: {
          transparent: 'transparent',
          current: 'currentColor',
          ink: {
            950: '#ffffff',
            900: '#ffffff',
            800: '#f6f7fb',
            700: '#e6e8f0',
            600: '#cfd3df',
          },
          brass: {
            400: '#8b6cff',
            500: '#6d45ed',
            600: '#5632cb',
          },
          stone: {
            100: '#1f2329',
            200: '#30343b',
            300: '#565d6b',
            400: '#7d8494',
            500: '#a1a7b4',
          },
          leaf: {
            400: '#18a56d',
            500: '#0c8d5b',
            600: '#08774d',
          },
          clay: {
            400: '#ef6b73',
            500: '#df4852',
            600: '#c9343e',
          },
        },
        fontFamily: {
          heading: ['"Noto Sans SC"', 'Inter', 'system-ui', 'sans-serif'],
          sans: ['Inter', '"Noto Sans SC"', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'SF Mono', 'monospace'],
        },
        extend: {
          keyframes: {
            'pulse-brass': {
              '0%, 100%': { boxShadow: '0 0 4px rgba(201,168,76,0.3)' },
              '50%': { boxShadow: '0 0 16px rgba(201,168,76,0.6)' },
            },
            'shimmer': {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            },
            'slide-up': {
              '0%': { opacity: '0', transform: 'translateY(8px) scale(0.96)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            },
            'fade-out': {
              '0%': { opacity: '1' },
              '100%': { opacity: '0' },
            },
          },
          animation: {
            'pulse-brass': 'pulse-brass 2s ease-in-out infinite',
            'shimmer': 'shimmer 1.5s ease-in-out infinite',
            'slide-up': 'slide-up 0.25s ease-out',
            'fade-out': 'fade-out 0.2s ease-in forwards',
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="/css/styles.css?v=volc-style-v3">
  <link rel="stylesheet" href="/css/patterns.css">
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="/js/utils.jsx?v=four-step-v2"></script>
  <script type="text/babel" src="/js/components/StepTabs.jsx?v=volc-style-v2"></script>
  <script type="text/babel" src="/js/components/LogViewer.jsx"></script>
  <script type="text/babel" src="/js/components/ArtifactList.jsx"></script>
  <script type="text/babel" src="/js/components/StoryboardViewer.jsx?v=props-v2"></script>
  <script type="text/babel" src="/js/components/StepView.jsx?v=volc-style-v19"></script>
  <script type="text/babel" src="/js/components/PipelineDetail.jsx?v=manual-steps-v3"></script>
  <script type="text/babel" src="/js/components/CreatePipeline.jsx?v=volc-style-v2"></script>
  <script type="text/babel" src="/js/components/PipelineList.jsx?v=asset-mosaics-v20"></script>
  <script type="text/babel" src="/js/components/App.jsx?v=volc-style-v4"></script>
  <script type="text/babel" src="/js/main.jsx"></script>
</body>
</html>
