<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Reelix Studio · AI 剧本到视频</title>
  <desc id="description">从剧本到成片的一站式 AI 视频创作工作台</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="34" x2="1120" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#edf1ff"/>
      <stop offset=".55" stop-color="#f7f6ff"/>
      <stop offset="1" stop-color="#f4edff"/>
    </linearGradient>
    <linearGradient id="brand" x1="45" y1="45" x2="165" y2="165" gradientUnits="userSpaceOnUse">
