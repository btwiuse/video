    <rect x="24" y="24" width="387" height="57" rx="15" fill="#f4f3fb"/>
    <circle cx="53" cy="52" r="11" fill="#6d45ed"/>
    <rect x="76" y="42" width="132" height="11" rx="5.5" fill="#3e3a58"/>
