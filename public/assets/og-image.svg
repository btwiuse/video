    <path d="M36 15c4 21 12 29 33 33-21 4-29 12-33 33-4-21-12-29-33-33 21-4 29-12 33-33Z" fill="#fff"/>
    <text x="94" y="31" fill="#26243a" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700">Reelix Studio</text>
    <text x="94" y="58" fill="#77748c" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17">AI 剧本到视频</text>
  </g>
  <g transform="translate(76 223)">
    <text fill="#1f1d31" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="62" font-weight="700">把剧本变成影片</text>
