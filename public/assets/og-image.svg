      <stop offset="1" stop-color="#743ce8"/>
    </linearGradient>
    <linearGradient id="card" x1="658" y1="154" x2="1094" y2="498" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5a76f7"/>
      <stop offset="1" stop-color="#8a55ec"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#5c4aa3" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1050" cy="40" r="270" fill="#c9c1ff" fill-opacity=".32"/>
  <circle cx="145" cy="660" r="250" fill="#c7dcff" fill-opacity=".38"/>
  <g transform="translate(76 70)">
